syntax = "proto3";

package greetertest;

option go_package = "kyrux/core/internal/greetertest";

// Greeter é um serviço mínimo, só para os testes de core/adapters/apigrpc
// exercitarem uma chamada gRPC real (protoc gerado, não hipotético).
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
