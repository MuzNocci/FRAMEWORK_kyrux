{{define "content"}}
<div class="page-head"><h1>Painel</h1></div>
{{if .Models}}
<div class="cards">
  {{range .Models}}
  <a href="{{$.BasePath}}{{.Slug}}/" class="model-card">
    <h3>{{.Label}}</h3>
    <p>/{{.Slug}}/</p>
  </a>
  {{end}}
</div>
{{else}}
<div class="panel">
  <div class="empty">
    Nenhum model registrado ainda.<br>
    Use <code>admin.Register[SeuModel]("slug", "Rótulo")</code> no <code>Register()</code> do seu app.
  </div>
</div>
{{end}}
{{end}}
