{{define "content"}}
<div class="login-shell">
  <div class="login-box">
    <h1>{{.AppName}} Admin</h1>
    {{if .FlashError}}<div class="alert alert-error">{{.FlashError}}</div>{{end}}
    <form method="POST" action="{{.BasePath}}login/">
      <input type="hidden" name="{{.CSRFField}}" value="{{.CSRFToken}}">
      <div class="form-group">
        <label for="f-login">Usuário</label>
        <input class="form-control" type="text" id="f-login" name="login" value="{{.LoginValue}}" autofocus required>
      </div>
      <div class="form-group">
        <label for="f-password">Senha</label>
        <input class="form-control" type="password" id="f-password" name="password" required>
      </div>
      <div class="form-actions" style="border:none;padding-top:.25rem;margin-top:.5rem">
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Entrar</button>
      </div>
    </form>
  </div>
</div>
{{end}}
